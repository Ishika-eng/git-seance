[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-seance"
version = "0.2.0"
description = "Raise a repository's deleted files, question them, and find out what still haunts your code. Local open-weight model, no dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
git-seance = "seance:main"

[tool.setuptools]
py-modules = ["seance"]
